# Watch Next local stack
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level
      - warn
    ports:
      - "19092:19092"
      - "18082:18082"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        rpk topic create events.interactions events.impressions events.dead-letter --brokers redpanda:9092 || true

  ml-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml
    environment:
      WATCHNEXT_ROOT: /app
      WATCHNEXT_ARTIFACTS: /app/artifacts
      WATCHNEXT_PROCESSED: /app/data/processed
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    ports:
      - "8090:8090"
    depends_on:
      redis:
        condition: service_healthy

  feature-consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.consumer
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDIS_URL: redis://redis:6379/0
      WATCHNEXT_ROOT: /app
      METRICS_PORT: "8091"
    volumes:
      - ./data:/app/data
    ports:
      - "8091:8091"
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_started

  recommendation-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      HTTP_ADDR: ":8080"
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: redpanda:9092
      ML_BASE_URL: http://ml-service:8090
      SHADOW_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
      redpanda:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - recommendation-api
      - feature-consumer

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - recommendation-api
